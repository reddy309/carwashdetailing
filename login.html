<!doctype html>

<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CarShine | Login</title>

    <!-- =====================================================
   GOOGLE FONTS


====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- =====================================================
   CSS


====================================================== -->

    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <!-- =====================================================
       LOGIN PAGE
  ====================================================== -->

    <main class="login-page">
      <!-- ===================================================
     BACKGROUND DECORATION
===================================================== -->

      <div class="background-decoration">
        <span class="bg-circle circle-one"></span>
        <span class="bg-circle circle-two"></span>
        <span class="bg-circle circle-three"></span>

        <span class="bg-dot dot-one"></span>
        <span class="bg-dot dot-two"></span>
        <span class="bg-dot dot-three"></span>

        <span class="bg-line line-one"></span>
        <span class="bg-line line-two"></span>
      </div>

      <!-- ===================================================
     TOP RIGHT ACTIONS
===================================================== -->

      <div class="header-actions">
        <!-- RTL -->

        <button
          type="button"
          class="rtl-button"
          id="rtlToggle"
          aria-label="Switch to RTL"
          title="Switch to RTL"
        >
          RTL
        </button>

        <!-- DARK / LIGHT -->

        <button
          type="button"
          class="icon-button"
          id="darkToggle"
          aria-label="Dark Mode"
          title="Dark Mode"
        >
          <i data-lucide="moon"></i>
        </button>
      </div>

      <!-- ===================================================
     LOGIN CARD
===================================================== -->

      <section class="login-card">
        <!-- =================================================
       LOGO
  ================================================== -->

        <div class="login-brand">
          <a href="index.html" class="brand-link">
            <img
              src="images/logo pro2.png"
              alt="CarShine Logo"
              class="brand-logo"
            />

            <span class="brand-name"> Car<span>Shine</span> </span>
          </a>
        </div>

        <!-- =================================================
       LOGIN TITLE
  ================================================== -->

        <div class="login-title">
          <h1>Login</h1>

          <p>Access your CarShine account.</p>
        </div>

        <!-- =================================================
       LOGIN FORM
  ================================================== -->

        <form class="login-form">
          <!-- EMAIL -->

          <div class="form-group">
            <label for="email"> Email Address </label>

            <div class="input-wrapper">
              <i data-lucide="mail"></i>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
              />
            </div>
          </div>

          <!-- PASSWORD -->

          <div class="form-group">
            <label for="password"> Password </label>

            <div class="input-wrapper">
              <i data-lucide="lock-keyhole"></i>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
              />

              <button
                type="button"
                class="password-button"
                id="passwordToggle"
                aria-label="Show password"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <!-- =================================================
         REMEMBER / FORGOT
    ================================================== -->

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember" />

              <span>Remember Me</span>
            </label>

            <a href="#" class="forgot-password"> Forgot Password? </a>
          </div>

          <!-- =================================================
         LOGIN BUTTON
    ================================================== -->

          <button type="submit" class="login-submit">Login</button>

          <!-- =================================================
         DIVIDER
    ================================================== -->

          <div class="divider">
            <span></span>

            <small>Or continue with</small>

            <span></span>
          </div>

          <!-- =================================================
         SOCIAL LOGIN
    ================================================== -->

          <div class="social-buttons">
            <!-- GOOGLE -->

            <button type="button" class="social-button">
              <span class="google-symbol"> G </span>

              <span>Google</span>
            </button>

            <!-- APPLE -->

            <button type="button" class="social-button">
              <i data-lucide="smartphone"></i>
              <span>Apple</span>
            </button>
          </div>

          <!-- =================================================
         SIGN UP
    ================================================== -->

          <p class="signup-text">
            Don't have an account?

            <a href="signup.html"> Sign Up </a>
          </p>
        </form>
      </section>
    </main>

    <script src="main .js"></script>
    <script src="login.js"></script>
  </body>
</html>
